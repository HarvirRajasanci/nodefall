services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nodefall
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nodefall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodefall"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      NODEFALL_JWT_SECRET: local-dev-secret-do-not-use-in-prod
      NODEFALL_DB_URL: postgres://nodefall:devpassword@postgres:5432/nodefall?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  game-1:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    environment:
      NODEFALL_JWT_SECRET: local-dev-secret-do-not-use-in-prod
      NODEFALL_INSTANCE_ID: game-1
      NODEFALL_REDIS_URL: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "9090:9090"

  game-2:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    environment:
      NODEFALL_JWT_SECRET: local-dev-secret-do-not-use-in-prod
      NODEFALL_INSTANCE_ID: game-2
      NODEFALL_REDIS_URL: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8091:8081"
      - "9091:9090"

  matchmaker:
    build:
      context: .
      dockerfile: services/matchmaker/Dockerfile
    environment:
      NODEFALL_JWT_SECRET: local-dev-secret-do-not-use-in-prod
      NODEFALL_REDIS_URL: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - auth
      - game-1
      - game-2
      - matchmaker
    ports:
      - "80:80"

volumes:
  pgdata:
