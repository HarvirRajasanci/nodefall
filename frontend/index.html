<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nodefall</title>
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  #hud {
    position: fixed; top: 8px; left: 8px; color: #eee;
    font: 14px monospace; z-index: 1;
  }
  #connectBar {
    position: fixed; top: 8px; right: 8px; z-index: 1;
  }
  input, button { font: 14px monospace; }
</style>
</head>
<body>

<div id="hud">Not connected</div>
<div id="connectBar">
  <input id="playerID" placeholder="player ID" value="player-1">
  <button id="connectBtn">Connect</button>
</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const MAP_SIZE = 3000; // must match world.MapSize
const PLAYER_RADIUS = 16; // must match world.PlayerRadius
const BULLET_RADIUS = 6;  // must match world.BulletRadius
const ITEM_RADIUS = 18;   // must match world.ItemRadius

let ws = null;
let state = { players: [], bullets: [], items: [], zone: null };
let selfID = null;

// Camera follows the local player, so a MAP_SIZE-scale world fits on screen.
let camera = { x: 0, y: 0 };

const input = { dx: 0, dy: 0, angle: 0, shoot: false };
const keys = {};

document.getElementById("connectBtn").addEventListener("click", () => {
  const id = document.getElementById("playerID").value.trim();
  if (!id) return;
  connect(id);
});

function connect(playerID) {
  selfID = playerID;
  ws = new WebSocket(`ws://localhost:8081/ws/${encodeURIComponent(playerID)}`);

  ws.onopen = () => { hud.textContent = `connected as ${playerID}`; };
  ws.onclose = () => { hud.textContent = "disconnected"; };
  ws.onerror = () => { hud.textContent = "connection error"; };

  ws.onmessage = (event) => {
    state = JSON.parse(event.data);
  };
}

// --- Input handling ---

window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener("mousemove", (e) => {
  const dx = e.clientX - canvas.width / 2;
  const dy = e.clientY - canvas.height / 2;
  input.angle = Math.atan2(dy, dx);
});

canvas.addEventListener("mousedown", () => { input.shoot = true; });
canvas.addEventListener("mouseup", () => { input.shoot = false; });

// Sends the current input state to the server at a fixed rate,
// independent of render/animation frame timing.
setInterval(() => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  input.dx = (keys["d"] ? 1 : 0) - (keys["a"] ? 1 : 0);
  input.dy = (keys["s"] ? 1 : 0) - (keys["w"] ? 1 : 0);

  ws.send(JSON.stringify(input));
}, 50); // 20/sec, matching world.TickRate

// --- Rendering ---

function worldToScreen(x, y) {
  return {
    x: x - camera.x + canvas.width / 2,
    y: y - camera.y + canvas.height / 2,
  };
}

function draw() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const self = state.players?.find((p) => p.id === selfID);
  if (self) {
    camera.x = self.x;
    camera.y = self.y;
  }

  // Zone
  if (state.zone) {
    const c = worldToScreen(state.zone.x, state.zone.y);
    ctx.strokeStyle = "#4af";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(c.x, c.y, state.zone.radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Items
  ctx.fillStyle = "#fc4";
  for (const item of state.items ?? []) {
    const p = worldToScreen(item.x, item.y);
    ctx.beginPath();
    ctx.arc(p.x, p.y, ITEM_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }

  // Bullets
  ctx.fillStyle = "#ff4";
  for (const bullet of state.bullets ?? []) {
    const p = worldToScreen(bullet.x, bullet.y);
    ctx.beginPath();
    ctx.arc(p.x, p.y, BULLET_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }

  // Players
  for (const player of state.players ?? []) {
    if (!player.alive) continue;
    const p = worldToScreen(player.x, player.y);

    ctx.fillStyle = player.id === selfID ? "#4f8" : "#f44";
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // Facing direction
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(player.angle) * PLAYER_RADIUS * 1.5, p.y + Math.sin(player.angle) * PLAYER_RADIUS * 1.5);
    ctx.stroke();

    // HP bar
    ctx.fillStyle = "#333";
    ctx.fillRect(p.x - 20, p.y - PLAYER_RADIUS - 12, 40, 5);
    ctx.fillStyle = "#4f8";
    ctx.fillRect(p.x - 20, p.y - PLAYER_RADIUS - 12, 40 * (player.hp / 100), 5);
  }

  if (selfID) {
    const self = state.players?.find((p) => p.id === selfID);
    if (self) {
      hud.textContent = `${selfID} — HP ${self.hp}  Armour ${self.armour}  Gun ${self.gun}${self.alive ? "" : "  (DEAD)"}`;
    }
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
