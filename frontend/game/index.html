<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nodefall</title>
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  #hud {
    position: fixed; top: 8px; left: 8px; color: #eee;
    font: 14px monospace; z-index: 1;
  }
  #loginBar {
    position: fixed; top: 8px; right: 8px; z-index: 1;
    display: flex; gap: 4px;
  }
  input, button { font: 14px monospace; }
  #error { color: #f66; }
</style>
</head>
<body>

<div id="hud">Not connected</div>
<div id="loginBar">
  <input id="username" placeholder="username">
  <input id="password" placeholder="password" type="password">
  <button id="loginBtn">Login & Play</button>
</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const AUTH_URL = "http://localhost:8082";
const GAME_WS_URL = "ws://localhost:8081/ws";

const MAP_SIZE = 3000;
const PLAYER_RADIUS = 16;
const BULLET_RADIUS = 6;
const ITEM_RADIUS = 18;

let ws = null;
let state = { players: [], bullets: [], items: [], zone: null };
let selfID = null;

let camera = { x: 0, y: 0 };
const input = { dx: 0, dy: 0, angle: 0, shoot: false };
const keys = {};

document.getElementById("loginBtn").addEventListener("click", loginAndConnect);

async function loginAndConnect() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  if (!username || !password) return;

  hud.textContent = "logging in...";

  try {
    const res = await fetch(`${AUTH_URL}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });

    if (!res.ok) {
      hud.textContent = `login failed (${res.status})`;
      return;
    }

    const { token } = await res.json();
    selfID = decodeUserID(token);
    connect(token);
  } catch (err) {
    hud.textContent = "login request failed: " + err.message;
  }
}

// Decodes the JWT payload client-side (no signature check — this is
// purely for the UI to know its own player ID, not a security check;
// the server independently verifies the token via shared/jwt.Verify).
function decodeUserID(token) {
  const payload = token.split(".")[1];
  const json = atob(payload.replace(/-/g, "+").replace(/_/g, "/"));
  return JSON.parse(json).user_id;
}

function connect(token) {
  ws = new WebSocket(`${GAME_WS_URL}?token=${encodeURIComponent(token)}`);

  ws.onopen = () => { hud.textContent = `connected as ${selfID}`; };
  ws.onclose = () => { hud.textContent = "disconnected"; };
  ws.onerror = () => { hud.textContent = "connection error"; };

  ws.onmessage = (event) => {
    state = JSON.parse(event.data);
  };
}

// --- Input handling ---

window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener("mousemove", (e) => {
  const dx = e.clientX - canvas.width / 2;
  const dy = e.clientY - canvas.height / 2;
  input.angle = Math.atan2(dy, dx);
});

canvas.addEventListener("mousedown", () => { input.shoot = true; });
canvas.addEventListener("mouseup", () => { input.shoot = false; });

setInterval(() => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  input.dx = (keys["d"] ? 1 : 0) - (keys["a"] ? 1 : 0);
  input.dy = (keys["s"] ? 1 : 0) - (keys["w"] ? 1 : 0);

  ws.send(JSON.stringify(input));
}, 50);

// --- Rendering ---

function worldToScreen(x, y) {
  return {
    x: x - camera.x + canvas.width / 2,
    y: y - camera.y + canvas.height / 2,
  };
}

function draw() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const self = state.players?.find((p) => p.id === selfID);
  if (self) {
    camera.x = self.x;
    camera.y = self.y;
  }

  if (state.zone) {
    const c = worldToScreen(state.zone.x, state.zone.y);
    ctx.strokeStyle = "#4af";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(c.x, c.y, state.zone.radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = "#fc4";
  for (const item of state.items ?? []) {
    const p = worldToScreen(item.x, item.y);
    ctx.beginPath();
    ctx.arc(p.x, p.y, ITEM_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = "#ff4";
  for (const bullet of state.bullets ?? []) {
    const p = worldToScreen(bullet.x, bullet.y);
    ctx.beginPath();
    ctx.arc(p.x, p.y, BULLET_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const player of state.players ?? []) {
    if (!player.alive) continue;
    const p = worldToScreen(player.x, player.y);

    ctx.fillStyle = player.id === selfID ? "#4f8" : "#f44";
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(player.angle) * PLAYER_RADIUS * 1.5, p.y + Math.sin(player.angle) * PLAYER_RADIUS * 1.5);
    ctx.stroke();

    ctx.fillStyle = "#333";
    ctx.fillRect(p.x - 20, p.y - PLAYER_RADIUS - 12, 40, 5);
    ctx.fillStyle = "#4f8";
    ctx.fillRect(p.x - 20, p.y - PLAYER_RADIUS - 12, 40 * (player.hp / 100), 5);
  }

  if (selfID) {
    const self = state.players?.find((p) => p.id === selfID);
    if (self) {
      hud.textContent = `${selfID.slice(0,8)} — HP ${self.hp}  Armour ${self.armour}  Gun ${self.gun}${self.alive ? "" : "  (DEAD)"}`;
    }
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
